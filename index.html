:root{
  --ink:#070A12; --ink2:#0D1424; --sea:#0E2433; --gold:#D8B46A; --gold2:#F1D9A0; --sand:#E8DCC4; --pearl:#F6F1E7; --mute:#8C93A3;
  --flag-red:#EF3340; --flag-green:#00843D;
  --lat:'Marcellus',Georgia,serif; --body:'Figtree',system-ui,sans-serif; --ar:'Noto Kufi Arabic','Geeza Pro','Segoe UI',sans-serif;--arb:'Noto Kufi Arabic','Geeza Pro','Segoe UI',sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--pearl);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#14203A 0%,var(--ink) 60%)}
#fx{position:absolute;inset:0;width:100%;height:100%}
#flag{position:absolute;left:0;top:0;display:none;pointer-events:none;will-change:opacity}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,10,18,.55) 0%,rgba(7,10,18,0) 18%,rgba(7,10,18,0) 42%,rgba(7,10,18,.82) 68%,rgba(7,10,18,.96) 100%)}

/* text */
#txt{position:absolute;left:0;right:0;bottom:0;padding:0 24px calc(34px + var(--safe-b));pointer-events:none}
.scene{position:absolute;left:24px;right:24px;bottom:calc(34px + var(--safe-b));display:none}
.scene.on,.scene.pre{display:block}
.kicker{font:600 11px var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:14px}
.kicker:before{content:"";width:22px;height:1px;background:var(--gold)}
h1,h2{font-family:var(--lat);font-weight:400;line-height:1.02;letter-spacing:-.01em;color:var(--pearl)}
h1{font-size:clamp(40px,12.5vw,64px)}
h2{font-size:clamp(32px,9.6vw,50px)}
.ar{font-family:var(--arb);direction:rtl;text-align:right;unicode-bidi:isolate}
.arh{font-family:var(--ar);direction:rtl;text-align:right;font-weight:700;font-size:clamp(24px,7vw,38px);line-height:1.45;color:var(--gold2);margin-top:6px}
p.en{font-size:15.5px;line-height:1.5;color:#D6D2C8;margin-top:14px;max-width:34em}
p.ar{font-size:15px;line-height:1.8;color:#C9C3B4;margin-top:8px;font-weight:400}
.big{font-family:var(--lat);font-size:clamp(76px,26vw,132px);line-height:.9;color:transparent;-webkit-text-stroke:1px var(--gold);letter-spacing:-.02em}
.big.fill{color:var(--gold2);-webkit-text-stroke:0}
.row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.facts{list-style:none;margin-top:14px;display:grid;gap:10px}
.facts li{display:grid;grid-template-columns:18px 1fr;gap:0 8px;font-size:14.5px;line-height:1.42;color:#E2DDD2}
.facts li:before{content:"";width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--c,var(--gold));box-shadow:0 0 10px var(--c,var(--gold))}
.facts li .ar{grid-column:2;font-size:13.5px;line-height:1.75;color:#B9B2A2;margin-top:2px}
.num{font:400 13px var(--lat);color:var(--mute);letter-spacing:.2em;margin-bottom:6px}
.founders{list-style:none;display:grid;gap:5px;margin-top:10px}
.founders li{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding-bottom:5px;border-bottom:1px solid rgba(216,180,106,.18);align-items:center}
.founders .n{font:400 14px var(--body);color:var(--pearl)}
.founders .e{font:600 10px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);align-self:center}
.founders .an,.founders .ea{font:400 13px var(--arb);direction:rtl;text-align:right;color:#B9B2A2}
.founders .role{color:var(--gold2);font-size:12px}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0) * 1ms)}
.on .rv{opacity:1;transform:none}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.w>i{display:inline-block;font-style:normal;transform:translateY(105%);transition:transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--d,0) * 1ms)}
.on .w>i{transform:none}

/* fx art */
.art{position:absolute;left:50%;transform:translateX(-50%);width:min(78vw,380px);opacity:0;transition:opacity 1s}
.art.on{opacity:1}
.art path,.art line,.art circle,.art rect,.art polyline,.art ellipse{fill:none;stroke:var(--gold2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.art .draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.4s cubic-bezier(.6,.1,.2,1)}
.art.on .draw{stroke-dashoffset:0}
.art .soft{stroke:rgba(216,180,106,.35)}
.art .solid{fill:var(--gold2);stroke:none}
.wave{animation:wave 7s linear infinite}
.wave.b{animation-duration:11s;opacity:.55}
.wave.c{animation-duration:15s;opacity:.3}
@keyframes wave{to{transform:translateX(-200px)}}
.bob{animation:bob 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(3px) rotate(-1.2deg)}}
.pearl{fill:url(#pearlg)!important;stroke:none!important;filter:drop-shadow(0 0 14px rgba(246,241,231,.8))}
.orbit{transform-origin:100px 80px;animation:orbit 6s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}

/* ui */
#bar{position:absolute;top:calc(3px + var(--safe-t));left:12px;right:12px;display:flex;gap:4px;z-index:9;transition:opacity .3s}
#bar a{flex:1;height:16px;display:flex;align-items:center;cursor:pointer}
#bar i{flex:1;height:2px;border-radius:2px;background:rgba(246,241,231,.18);overflow:hidden;position:relative}
#bar i b{position:absolute;inset:0;background:var(--gold2);transform-origin:left;transform:scaleX(0)}
#top{position:absolute;top:calc(20px + var(--safe-t));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:6}
#brand{font:400 12px var(--lat);letter-spacing:.32em;color:var(--sand);opacity:.8}
.btns{display:flex;gap:8px}
.btn{pointer-events:auto;height:34px;min-width:34px;padding:0 11px;border-radius:17px;border:1px solid rgba(216,180,106,.4);background:rgba(7,10,18,.66);
  color:var(--pearl);font:600 12px var(--body);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
#tapL,#tapR{position:absolute;top:78px;bottom:0;z-index:4}
#tapL{left:0;width:30%}#tapR{right:0;width:70%}
#hint{position:absolute;left:0;right:0;bottom:calc(10px + var(--safe-b));text-align:center;font:500 10px var(--body);letter-spacing:.25em;text-transform:uppercase;color:var(--mute);z-index:3;transition:opacity 1s}
#endui{position:absolute;left:24px;right:24px;bottom:calc(26px + var(--safe-b));display:flex;gap:10px;z-index:7;opacity:0;pointer-events:none;transition:opacity .8s}
#endui.on{opacity:1;pointer-events:auto}
#endui .btn{flex:1;height:44px;border-radius:22px;font-size:13px}
#endui .btn.pri{background:var(--gold);color:var(--ink);border-color:var(--gold)}
#card{position:absolute;left:16px;right:16px;bottom:calc(84px + var(--safe-b));z-index:8;padding:18px 18px 16px;border-radius:18px;background:rgba(10,15,27,.94);
  border:1px solid rgba(216,180,106,.3);transform:translateY(20px);opacity:0;pointer-events:none;transition:.5s cubic-bezier(.2,.8,.2,1)}
#card.on{transform:none;opacity:1;pointer-events:auto}
#card h3{font:400 26px var(--lat);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#card h3 .ar{font-size:22px;color:var(--gold2)}
/* one language at a time for body text; headlines stay bilingual */
p.ar,.facts li .ar,.founders .an,.founders .ea,.founders .role.ar{display:none}
body.arf p.en,body.arf .facts li>span:not(.ar),body.arf .founders .n,body.arf .founders .e,body.arf .founders .role.en{display:none}
body.arf p.ar,body.arf .facts li .ar,body.arf .founders .an,body.arf .founders .ea,body.arf .founders .role.ar{display:block}
body.arf .facts li .ar{font-size:15.5px;line-height:1.7;color:#E2DDD2}
body.arf .founders li{direction:rtl}
body.arf .founders .an{font:400 14px var(--arb);color:var(--pearl)}
body.arf .founders .ea{font:600 12px var(--arb);color:var(--gold);text-align:left}
.founders .role{grid-column:1/3}
body.arf .scene h1,body.arf .scene h2{font-size:clamp(24px,7vw,34px);color:var(--sand)}
body.arf .scene .arh{font-size:clamp(28px,8vw,42px);color:var(--pearl);line-height:1.35}
body.arf .scene #s7 .arh.sm,body.arf #s7 .arh.sm{font-size:clamp(19px,5.2vw,22px)}
body:not(.arf) #s7 .arh{font-size:clamp(15px,4.5vw,18px)}
body.arf .scene .arh.sm{font-size:clamp(24px,6.8vw,32px)}
body.arf .scene h1.sm,body.arf .scene h2.sm{font-size:clamp(19px,5.2vw,24px)}
body.arf .big{font-size:clamp(56px,18vw,92px)}
body.arf .kicker{margin-bottom:8px}
body.arf .founders{gap:2px;margin-top:4px}
body.arf .founders li span{line-height:1.2}
body.arf .founders .role{font-size:11px}
body.arf #s7 .head{margin-bottom:-2px}
body.arf .founders li{padding-bottom:2px}
body.arf .scene .head{display:flex;flex-direction:column-reverse}
body.arf p.ar{font-size:16px;line-height:1.6;margin-top:8px;color:#E6E0D2}
body.arf .kicker{flex-direction:row-reverse;justify-content:flex-end}
@media (min-aspect-ratio:4/5){#stage{max-width:480px;margin:0 auto;left:0;right:0;border-left:1px solid #1a2233;border-right:1px solid #1a2233}}
@media (prefers-reduced-motion:reduce){.wave,.bob,.orbit,.chv{animation:none}}

/* ---------- v2: 3D model layer ---------- */
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#shade{transition:opacity .8s;background:linear-gradient(180deg,rgba(7,10,18,.5) 0%,rgba(7,10,18,0) 15%,rgba(7,10,18,0) 55%,rgba(10,10,14,.72) 66%,rgba(8,9,14,.93) 80%,rgba(7,10,18,.97) 100%)}
body.exploring #shade{opacity:0}
#labs{position:absolute;left:0;right:0;top:0;height:52%;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;font:400 13px var(--lat);letter-spacing:.14em;text-transform:uppercase;color:var(--pearl);white-space:nowrap;opacity:0;transition:none;
  text-shadow:0 0 3px rgba(7,10,18,.95),0 1px 8px rgba(7,10,18,.9);will-change:transform}
.lab.on{opacity:.92;transition:opacity .25s}
.lab.sm{font-size:11px}
.lab .la{display:none;font:600 14px var(--arb);letter-spacing:0;text-transform:none;direction:rtl}.lab.sm .la{font-size:12px}
body.arf .lab .le{display:none}body.arf .lab .la{display:inline}
h1.sm{font-size:clamp(34px,10.5vw,50px)}h2.sm{font-size:clamp(28px,8.4vw,40px)}.arh.sm{font-size:clamp(20px,6vw,28px);margin-top:2px}
.dots{display:flex;align-items:center;gap:12px;margin-top:14px}
.ring7{width:38px;height:38px;flex:none;fill:none;stroke-linecap:round}
.dcol{display:flex;flex-direction:column;gap:4px}
body.arf .dots{direction:rtl}
.dn{font:400 14px var(--lat);letter-spacing:.14em;color:var(--sand);direction:ltr;unicode-bidi:isolate}
.dtag{font:600 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#pill{position:absolute;top:calc(34px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:9;padding:6px 14px;border-radius:16px;background:rgba(7,10,18,.8);border:1px solid rgba(216,180,106,.45);color:var(--gold2);font:600 12px var(--body);letter-spacing:.12em;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
body.paused #pill{opacity:1}
body.paused #bar{opacity:.5}
body.paused .wave,body.paused .bob,body.paused .orbit,body.paused .chv{animation-play-state:paused}
#spotui{position:absolute;left:24px;right:24px;bottom:calc(26px + var(--safe-b));display:flex;gap:10px;z-index:7;opacity:0;pointer-events:none;transition:opacity .8s}
#spotui.on{opacity:1;pointer-events:auto}
#spotui .btn{flex:1;height:44px;border-radius:22px;font-size:13px}
#spotui .btn.pri{background:var(--gold);color:var(--ink);border-color:var(--gold)}
body:not(.spot) #spotui{display:none}
body.spot #bar,body.route #bar{display:none}

/* ---------- round 2: bilingual-by-mode buttons, hints, finale ---------- */
.ba{display:none}body.arf .be{display:none}body.arf .ba{display:inline;font-family:var(--ar);font-weight:600}
.btn .be,.btn .ba{white-space:nowrap}
.lab.flare{font-size:21px;color:#FFF3D0;letter-spacing:.2em}
#labs.dk .lab{color:#2a1c08;text-shadow:0 0 3px rgba(255,246,224,.95),0 0 10px rgba(255,246,224,.85)}
#chev{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .5s}
#chev.on{opacity:1}
.chv{position:absolute;top:30%;width:18px;height:36px;fill:none;stroke:var(--gold2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(7,10,18,.6));animation:chv 1.8s ease-out 1 both}
.chv.l{left:8px}.chv.r{right:8px}
@keyframes chv{0%{opacity:.1;transform:scale(.8)}35%{opacity:1;transform:scale(1.12)}100%{opacity:.55;transform:scale(1)}}
#tip{position:absolute;left:0;right:0;bottom:calc(11px + var(--safe-b));text-align:center;z-index:5;pointer-events:none;opacity:0;transition:opacity .5s;font:500 11px var(--body);letter-spacing:.12em;color:var(--sand);text-shadow:0 0 6px rgba(7,10,18,.9)}
#tip.on{opacity:.92}
#finnum{position:absolute;left:0;right:0;top:16%;z-index:3;text-align:center;opacity:0;transition:opacity .7s;pointer-events:none}
#finnum.on{opacity:1}
#finnum .big,#finnum .dl{transition:color .5s,text-shadow .5s}
#finnum.dkc .big{color:#6B440A;text-shadow:none}
#finnum.dkc .dl{color:#2B1D08;text-shadow:none}
#finnum .big.pulse{animation:gp .7s ease-out 1}
@keyframes gp{0%{text-shadow:0 2px 26px rgba(7,10,18,.55),0 0 0 rgba(255,214,120,0)}40%{text-shadow:0 2px 26px rgba(7,10,18,.35),0 0 34px rgba(255,214,120,.9)}100%{text-shadow:0 2px 26px rgba(7,10,18,.55),0 0 0 rgba(255,214,120,0)}}
#finnum .big{font-size:clamp(64px,22vw,104px);line-height:.95;color:#EBCB86;text-shadow:0 2px 26px rgba(7,10,18,.55),0 0 2px rgba(7,10,18,.4)}
#finnum .dl{font:600 11px var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--pearl);margin-top:10px;text-shadow:0 1px 10px rgba(7,10,18,.85)}
.kicker .kc,.kicker .kn{letter-spacing:.2em}
.kc{display:none!important}body.fin7 .kc{display:block!important}body.fin7 .kn{display:none!important}body.fin7 .kicker .kc{display:inline!important}
.clk{font:400 13px var(--lat);letter-spacing:.18em;color:var(--sand);margin-top:12px;unicode-bidi:isolate}
body.arf .clk{direction:rtl;text-align:right;letter-spacing:0}
.ba,.arh,p.ar,.facts .ar,.founders .an,.founders .ea,.founders .role.ar,#lang,body.arf .kicker,body.arf .dtag,body.arf .dl,body.arf #pill,body.arf #tip,body.arf #hint,body.arf .kicker .kn,body.arf .kicker .kc,body.arf .clk{letter-spacing:0!important}
.scene.out{display:block;opacity:0;transition:opacity .25s}
.scene.out .rv{opacity:1;transform:none;transition:none}.scene.out .w>i{transform:none;transition:none}
body.arf .facts{direction:rtl}
body.rm #s16 .rv,body.rm #s16 .w>i{transition-delay:0ms!important}
</style>
</head>

  <canvas id="gl"></canvas>
  <div id="labs" aria-hidden="true"></div>

  <div id="fx" aria-hidden="true"></div>
  <div id="shade"></div>
  <div id="txt" aria-live="polite"></div>
  <div id="tapL"></div><div id="tapR"></div>
  <div id="bar"></div>
  <div id="top">
    <div id="brand">UAE · ٧</div>
    <div class="btns">

    </div>
  </div>
  <div id="hint" style="opacity:0"></div>
  <div id="pill"><span class="be">Paused</span><span class="ba">متوقف مؤقتاً</span></div>

  <div id="tip" aria-hidden="true"><span class="be">tap › next · hold to pause</span><span class="ba">اضغط للمتابعة · اضغط مطوّلاً للإيقاف المؤقت</span></div>
  <div id="finnum"><div class="big fill" id="days">0</div><div class="dl" id="daysl"><span class="be">days of Union</span><span class="ba" id="daysla"></span></div></div>

  <div id="spotui"><button class="btn pri" id="spotstory"><span class="be">Watch the story</span><span class="ba">شاهد القصة</span></button><button class="btn" id="spotexplore"><span class="be">Explore the map</span><span class="ba">استكشف الخريطة</span></button></div>

</div>
